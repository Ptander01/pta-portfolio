<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No `maximum-scale`: it blocks pinch-zoom, which is WCAG 1.4.4, and on
         a portfolio built out of dense map renders and small type it is the
         one gesture a reader on a phone actually needs. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Patrick T Anderson — Spatial Data Scientist</title>
    <meta name="description" content="Patrick T Anderson — spatial data scientist: research, build, present. Healthcare access, AI infrastructure, and environmental analysis. 47 pieces, 170,900 lines of code." />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Open Graph / Social
         NOTE: og:image and twitter:image must be ABSOLUTE URLs — LinkedIn,
         Slack, and Twitter do not reliably resolve relative paths. If this
         site moves to a custom domain, update the three URLs below. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Patrick T Anderson" />
    <meta property="og:url" content="https://pta-portfolio.vercel.app/" />
    <meta property="og:title" content="Patrick T Anderson — Spatial Data Scientist" />
    <meta property="og:description" content="Spatial data scientist: research, build, present. Healthcare access, AI infrastructure, and environmental analysis." />
    <meta property="og:image" content="https://pta-portfolio.vercel.app/assets/brand/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Patrick T Anderson — spatial data science portfolio" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Patrick T Anderson — Spatial Data Scientist" />
    <meta name="twitter:description" content="Spatial data scientist: research, build, present. Healthcare access, AI infrastructure, and environmental analysis." />
    <meta name="twitter:image" content="https://pta-portfolio.vercel.app/assets/brand/og-image.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
